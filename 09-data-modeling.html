    if (t) { var d = document.createElement("textarea"); d.innerHTML = t[1]; document.title = d.value; }

  function decrypt(rawKey) {

      return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(SALT), iterations: IT }, base, 256);
    });

  var f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  function ask() { f.hidden = false; document.getElementById("pw").focus(); }

  if (saved) decrypt(b64(saved)).then(show, function () { clear(); ask(); }); else ask();
  f.addEventListener("submit", function (ev) {
    ev.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = "Unlocking…";
    var raw;
    derive(document.getElementById("pw").value).then(function (r) { raw = r; return decrypt(r); }).then(function (htmlText) {
      put(ub64(raw), document.getElementById("rem").checked); show(htmlText);
    }, function () { go.disabled = false; go.textContent = "Unlock"; err.textContent = "Wrong password."; });
  });
})();
